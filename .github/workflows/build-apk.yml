name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build User App
        run: ./gradlew :user-app:assembleDebug

      - name: Build Admin App
        run: ./gradlew :admin-app:assembleDebug

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: user-app-apk
          path: user-app/build/outputs/apk/debug/*.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-apk
          path: admin-app/build/outputs/apk/debug/*.apk